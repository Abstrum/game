<style>

#view{display:flex;align-items:center;justify-content:center;padding:3px 9px}#view svg{width:26px;height:26px;display:block}

<script>
'use strict';
/* New Ekalabya Hostel - pixel diorama. Rendering style follows pixel-plays engine.js
   (depth buffer, hue-shifted ramps, Bayer dither, depth-buffer edges, stepped wind),
   but with a free camera: tilt, zoom, 360 orbit around the character. */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const rgb=(r,g,b)=>(255<<24|Math.min(255,b|0)<<16|Math.min(255,g|0)<<8|Math.min(255,r|0))>>>0;
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=ease(x-ix),fy=ease(y-iy);return lerp(lerp(hash(ix,iy),hash(ix+1,iy),fx),lerp(hash(ix,iy+1),hash(ix+1,iy+1),fx),fy);}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bayerAt=(x,y)=>BAYER[(y&3)*4+(x&3)];
const COOL=[46,38,84],WARM=[255,232,180];
const ramps=new WeakMap();
function rampOf(c){let r=ramps.get(c);if(r)return r;const mix=(m,t,k)=>rgb(lerp(c[0]*m,t[0],k),lerp(c[1]*m,t[1],k),lerp(c[2]*m,t[2],k));r=[mix(.4,COOL,.34),mix(.62,COOL,.18),mix(.84,COOL,.05),mix(1,WARM,0),mix(1.1,WARM,.22)];ramps.set(c,r);return r;}
const tintC=(c,r,g,b)=>rgb((c&255)*r,(c>>8&255)*g,(c>>16&255)*b);
const tc=(pal,tone,i,j)=>rampOf(pal)[clamp(Math.floor(tone+(bayerAt(i,j)-.5)*.7),0,4)];

/* ---------- display ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,OX=0,OY=0,img,pix,zb,pm,gdRow,gdp,zg,gpx,ghost1=false;
function resize(){let ps=1,nw=Math.max(100,Math.ceil(innerWidth/ps)),nh=Math.max(100,Math.ceil(innerHeight/ps));while(nw*nh>260000){ps+=.25;nw=Math.max(100,Math.ceil(innerWidth/ps));nh=Math.max(100,Math.ceil(innerHeight/ps));}W=nw;H=nh;cv.style.width=W*ps+'px';cv.style.height=H*ps+'px';cv.width=W;cv.height=H;img=ctx.createImageData(W,H);pix=new Uint32Array(img.data.buffer);zb=new Float32Array(W*H);zg=new Float32Array(W*H).fill(-1e9);gpx=new Uint32Array(W*H);pm=new Uint8Array(W*H);gdRow=new Float32Array(H);gdp=new Float32Array(W*H).fill(-1e9);OX=W/2;OY=H*.5;return;
  const dpr=window.devicePixelRatio||1;
  let art=Math.max(2,Math.round(1.8*dpr));
  let w=Math.floor(innerWidth*dpr/art),h=Math.floor(innerHeight*dpr/art);
  while(w*h>170000){art++;w=Math.floor(innerWidth*dpr/art);h=Math.floor(innerHeight*dpr/art);}
  W=Math.max(100,w);H=Math.max(100,h);
  cv.width=W;cv.height=H;img=ctx.createImageData(W,H);pix=new Uint32Array(img.data.buffer);
  zb=new Float32Array(W*H);zg=new Float32Array(W*H).fill(-1e9);gpx=new Uint32Array(W*H);pm=new Uint8Array(W*H);gdRow=new Float32Array(H);OX=W/2;OY=H*.5;
}

/* ---------- camera ---------- */
const DEF={yaw:22*Math.PI/180,el:30*Math.PI/180,S:8};
const cam={yaw:DEF.yaw,el:DEF.el,S:DEF.S,pitch:0};
let hasHor=false,hRow=0,DMAX=1e9;
let TP=false,tpD=4.4,FP=false,EX=0,EY=0,EZ=0,FL=300,fX=0,fY=1,fZ=0,rX=1,rY=0,uX=0,uY=0,uZ=1,inC=false,gt=11,flow=false;
const CX0=1e9,CX1=-1e9,CY0=1e9,CY1=-1e9,inRect=()=>false;
let cosY=1,sinY=0,ce=Math.cos(DEF.el),se=Math.sin(DEF.el),S=8,OZ=1.3,PX=0,PY=0;
function proj(x,y,z){if(FP){const vx=x-EX,vy=y-EY,vz=z-EZ,zc=vx*fX+vy*fY+vz*fZ,k=FL/Math.max(zc,.01);return{sx:OX+(vx*rX+vy*rY)*k,sy:OY-(vx*uX+vy*uY+vz*uZ)*k,d:-zc,zc};}const X=x-PX,Y=y-PY,rx=X*cosY+Y*sinY,ry=-X*sinY+Y*cosY;return{sx:OX+rx*S,sy:OY+(ry*se-(z-OZ)*ce)*S,d:ry*ce+z*se};}

/* ---------- palettes ---------- */
const PINK=[226,166,148],CREAM=[238,206,176],OCHRE=[222,170,64],YELL=[228,204,128],CONCB=[190,186,172],PLINTH=[176,156,146];
const GLASS=[40,36,64],SHUTR=[162,74,48],WOOD=[96,60,42],GRILLE=[176,98,44],DARK=[30,26,34],ROOFP=[142,134,124],MOSS=[96,116,70];
const CONC=[170,166,154],BLUE=[30,72,166],WHITE=[246,244,236],MAROON=[150,58,50],WALLC=[214,206,184],CAP=[110,100,94];
const BK={x:86.7,y:-0.4},BUCKB=[56,126,232],WRAPG=[84,178,98],WRAPH=[150,222,150],ROPEC=[22,22,26];
const POTS=[[10.5,53.15,0],[14.0,53.15,1],[18.2,53.15,2],[20.0,53.15,3],[23.6,53.15,4],[29.9,53.15,5],[31.3,59.2,6],[34.9,59.9,7],[36.0,53.1,8],[42.6,59.7,9],[41.8,53.1,10],[58.4,53.15,13],[62.0,53.15,14],[66.6,53.15,15],[69.5,53.15,16]].map((p)=>({x:p[0],y:p[1],i:p[2],kind:p[2]%3===1?1:0,lc:[[66,132,70],[92,152,66],[50,106,74]]}));
const POTC=[142,80,56],POTR=[170,104,72],SOILC=[58,44,36];
const nearBK=(x,y,R)=>(x-BK.x)*(x-BK.x)+(y-BK.y)*(y-BK.y)<R*R;
const PUMPC=[62,102,134],PIPEC=[100,116,132],CABLE=[44,42,48],BRICK=[176,90,68];
const G_EARTH=[176,150,104],G_DRY=[156,154,86],G_GRASS=[100,138,66],G_DEEP=[66,108,58];
const BARK=[104,84,66],LEAF_DEEP=[44,112,60],LEAF_MID=[84,158,70],LEAF_SILVER=[142,196,100];
const SHRUB1=[52,136,84],SHRUB2=[96,172,88];
const SHIRT=[214,84,66],STRIPE=[244,226,196],LEGS=[52,60,98],SKIN=[226,170,132],HAIR=[40,30,32],SHOE=[226,222,212];

/* ---------- scene storage ---------- */
const TF=6;                       // texels per world unit on walls
const SHADE={T:3.7,W:3.1,S:2.55,E:1.35,N:1.75,B:1.2};
const SHX=.7,SHY=-.25;            // shadow offset per unit of height (light from the west)
const faces=[],colliders=[],platforms=[],casters=[],treeCols=[],trees=[],tufts=[],shrubs=[];

  clc:[[10,10,16],[16,16,24],[22,22,32],[30,30,42]],stc:[[20,20,30],[30,30,44],[44,44,60]],
  pc:[[255,190,110],[220,120,80],[255,236,200]]
 }
 ,{name:'7',ter:{a0:3,a1:18,thr:.55,rm:.5,dune:2.2},rk:[150,122,100],gra:[238,230,196],grb:[226,214,176],
  tuf:[[[214,204,168],[230,222,190],[246,240,214]],[[204,194,160],[224,214,182],[240,234,206]]],flow:[[255,250,236],[255,244,214],[240,236,222]],
  tn:0,h0:.3,h1:.4,fp:0,sk:SK7,lk:LK7,haze:[30,80,208],
  clc:[[112,150,226],[168,198,246],[226,238,255],[255,255,255]],stc:[[120,150,220],[170,196,240],[220,232,252]],

];
function setWorld(n){
  world=n;CST=n===6?200:150;buildTerrain(n);RKP=WORLDS[n].rk||null;const w=WORLDS[n];
  if(n===5&&!S6)buildCliff();
  GRA=w.gra;GRB=w.grb;bakeGround();if(n===5){const v=rgb(2,2,5);for(const t of[gL,gS,gL2,gS2,gL3,gS3])t.fill(v);}
  TUFC=w.tuf.map(RGBA);FLOWC=RGBA(w.flow);SKc=w.sk;LKc=w.lk||LK;HAZE=w.haze||SKY0.haze;CLC=w.clc||SKY0.clc;STC=w.stc||SKY0.stc;
  if(!panoC[n]){bakePano(n);panoC[n]=pano.slice();}else pano.set(panoC[n]);
  cellMap.clear();tcMap.clear();updPBtn();streamWorld();
}
/* distant floating cubes on the horizon */
function bakeCubePano(){
  pano.fill(0);const cs=[];
  for(let k=0;k<70;k++){const e=-.02+Math.pow(hash(k,51),.8)*1.25;cs.push({a:hash(k,50)*6.2831853,e,s:.007+(e+.05)*.045*(.55+hash(k,52)*.9),sp:(hash(k,53)-.3)*.7});}
  for(let j=0;j<PH;j++){const el=PEL1-(j+.5)/PRPR;
    for(let i=0;i<PW;i++){const az=(i+.5)/PW*6.2831853;
      for(const C of cs){
        if(Math.abs(el-C.e)>=C.s)continue;
        const da=wrapPi(az-C.a);if(Math.abs(da)>=C.s)continue;
        const de=(el-C.e)/C.s;
        const col=de<-.55?[176,184,224]:da<C.sp*C.s?[238,234,230]:[196,200,232];
        pano[j*PW+i]=mixHaze(col,clamp(1-(el+.04)/.25,0,1)*.65);break;
      }
    }
  }
}
/* rotated floating cube built from textured faces */
function makeCube(x,y,zc,h,yaw){
  const cr=h*Math.SQRT2,cs=[];
  for(let j=0;j<4;j++){const a=yaw+Math.PI/4+j*Math.PI/2;cs.push([x+Math.cos(a)*cr,y+Math.sin(a)*cr]);}
  const z1=zc+h,z0=zc-h,sd=hash(x,y)*50,tw=Math.max(8,Math.round(h*2*TF));
  const mk=(ox,oy,oz,ux,uy,vx,vy,vz,nx,ny,nz)=>{
    const base=nz>.5?3.9:nz<-.5?1.3:1.5+1.8*clamp(-nx*.94+ny*.34,0,1);
    mkFace({ox,oy,oz,ux,uy,uz:0,vx,vy,vz,nx,ny,nz,tw,th:tw,grp:0,zf:0,fn:(i,j)=>{
      const e=Math.min(i,j,tw-1-i,tw-1-j);
      let t=base+(noise(i*.35+sd,j*.35+base*7)-.5)*.7+(hash(i+sd,j)>.97?-.5:0);
      if(e===0)t-=.45;
      return tc(CUBEC,t,i,j);}});
  };
  for(let j=0;j<4;j++){const A=cs[j],B=cs[(j+1)%4],a=yaw+Math.PI/2+j*Math.PI/2;
    mk(A[0],A[1],z1,B[0]-A[0],B[1]-A[1],0,0,-2*h,Math.cos(a),Math.sin(a),0);}
  const ux=cs[1][0]-cs[0][0],uy=cs[1][1]-cs[0][1],vx=cs[3][0]-cs[0][0],vy=cs[3][1]-cs[0][1];
  mk(cs[0][0],cs[0][1],z1,ux,uy,vx,vy,0,0,0,1);
  mk(cs[0][0],cs[0][1],z0,ux,uy,vx,vy,0,0,0,-1);
}
function cubeCell(c,cx,cy){
  for(let n=0;n<3;n++){
    if(hash(cx*4.3+n*9.1,cy*2.9+n*5.3)>.72)continue;
    const x=(cx+hash(cx*1.7+n,cy*3.9+7))*CELL,y=(cy+hash(cx*2.3+5,cy*1.3+n*3))*CELL;
    const big=hash(cx+n*3.3,cy*7.1)<.1;
    const h=(.8+Math.pow(hash(n+cx,cy*5.5),2)*2.6)*(big?2.4:1);
    const z=h+4+hash(cx*6.1,cy+n)*26+(big?10:0),yaw=hash(cx*9.1+n,cy*1.1)*1.5708;
    const b=faces.length;makeCube(x,y,z,h,yaw);
    {const fs=faces.splice(b),g=terrH(x,y);for(const f of fs)f.oz+=g;c.cubes.push({x,y,z:z+g,h,faces:fs});}
  }
}
/* ---- portal ---- */
const portal={on:false,x:0,y:0,z:0,nx:1,ny:0,to:1,open:0,armed:false,pa:null},wpos={};
let flashA=0;const flashEl=document.getElementById('flash'),pbtn=document.getElementById('pbtn');
function toast(m){const h=document.getElementById('hint');h.textContent=m;h.style.opacity=1;clearTimeout(hintT);hintT=setTimeout(()=>{h.style.opacity=0;},2200);}
function placePortal(x,y,fx,fy,to){portal.x=x;portal.y=y;portal.z=heightAt(x,y);portal.nx=fx;portal.ny=fy;portal.to=to;portal.open=0;portal.armed=false;portal.pa=null;portal.on=true;portal.t=0;portal.life=5;}
function openPortal(to){
  if(pl.climb||document.getElementById('panel').classList.contains('open'))return;
  const fx=Math.cos(pl.face),fy=Math.sin(pl.face);let d=4.4;
  while(d>1.8&&blocked(pl.x+fx*d,pl.y+fy*d,pl.z))d-=.4;
  placePortal(pl.x+fx*d,pl.y+fy*d,fx,fy,to);
  toast('PORTAL \u2192 '+WORLDS[portal.to].name);
}
function portalStep(dt){
  if(!portal.on)return;
  const L=portal.life||5;
  portal.t=(portal.t||0)+dt;if(portal.t>=L){portal.on=false;return;}portal.open=portal.t>L-.6?clamp((L-portal.t)/.6,0,1):Math.min(1,portal.open+dt*1.4);
  const dx=pl.x-portal.x,dy=pl.y-portal.y,al=dx*portal.nx+dy*portal.ny,lat=-dx*portal.ny+dy*portal.nx;
  if(!portal.armed){if(Math.hypot(dx,dy)>2.2)portal.armed=true;portal.pa=al;return;}
  const hit=portal.open>=.9&&Math.abs(lat)<1.05&&pl.z<portal.z+2.2&&(Math.abs(al)<.45||(portal.pa!==null&&portal.pa*al<0&&Math.abs(al)<1.6));
  portal.pa=al;if(hit)teleport();
}
function teleport(){
  const from=world,to=portal.to,w=WORLDS[to],EXIT=.9;
  // remember where we left this world: the portal we walked through, with its back side as the way out
  wpos[from]={x:portal.x,y:portal.y,dx:-portal.nx,dy:-portal.ny};
  flashEl.style.background='rgb('+w.pc[2].join(',')+')';flashA=1.15;
  setWorld(to);
  // the portal we come out of sits where we last left this world (or at the spawn point on first visit)
  const a=to===5?{x:-20,y:0,dx:1,dy:0}:(wpos[to]||{x:pl.x,y:pl.y,dx:Math.cos(pl.face),dy:Math.sin(pl.face)});
  let ax=a.x,ay=a.y;
  pl.x=ax;pl.y=ay;streamWorld();
  for(let r=0;(blocked(ax,ay,0)||blocked(ax+a.dx*EXIT,ay+a.dy*EXIT,0))&&r<40;r++){ax+=Math.cos(r*2.4)*.5;ay+=Math.sin(r*2.4)*.5;}
  pl.x=ax-a.dx*.3;pl.y=ay-a.dy*.3;
  pl.z=heightAt(ax,ay);pl.vz=0;pl.air=false;pl.sp=0;pl.face=Math.atan2(a.dy,a.dx);
  // the portal stands on the anchor point; you start inside the doorway and walk out of it
  placePortal(ax,ay,a.dx,a.dy,from);
  portal.open=1;portal.armed=false;portal.life=5;
  pl.emerge={t:0,dur:.55,ax,ay,dx:a.dx,dy:a.dy,d0:-.3,d1:EXIT};
  toast('WORLD \u00b7 '+w.name);
}
function drawPortal(){
  if(!portal.on)return;
  const op=Math.min(1,portal.open),p1=ease(clamp(op/.5,0,1)),p2=ease(clamp((op-.5)/.5,0,1));
  const RX=1.15*p1,RZ=1.9*p2,cz=portal.z+1.9+.1;
  if(p1<.02||!onScreen(portal.x,portal.y,cz,3.5*S))return;

  const style=window.portalStyle||'ember';
  const STY={
    void: {f:[0,0,0],e:[255,255,255],s:[0,0,0],g:[0,0,0]}
  };
  const pal=STY[style]||STY.void;

  const sx=-portal.ny,sy=portal.nx,fxn=portal.nx,fyn=portal.ny;
  const T=.22*p1;

  const P=(u,v,side)=>[
    portal.x+sx*u*RX+fxn*side*T*.5,
    portal.y+sy*u*RX+fyn*side*T*.5,
    cz+v*RZ
  ];

  const blendPx=(p,c,k)=>rgb(lerp(p&255,c&255,k),lerp(p>>8&255,c>>8&255,k),lerp(p>>16&255,c>>16&255,k));

  // quad: flat colour (array or packed), optional alpha for see-through panels
  const quad=(a,b,c,d,col0,al)=>{
    const col=Array.isArray(col0)?rgb(col0[0],col0[1],col0[2]):col0;
    const pts=[a,b,c,d].map(q=>{const p=proj(q[0],q[1],q[2]);return{sx:p.sx,sy:p.sy,d:p.d,zc:p.zc};});
    if(FP&&pts.some(p=>p.zc<.25))return;
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(const p of pts){if(p.sx<minx)minx=p.sx;if(p.sx>maxx)maxx=p.sx;if(p.sy<miny)miny=p.sy;if(p.sy>maxy)maxy=p.sy;}
    const x0=Math.max(0,Math.floor(minx)),x1=Math.min(W-1,Math.ceil(maxx));
    const y0=Math.max(0,Math.floor(miny)),y1=Math.min(H-1,Math.ceil(maxy));
    const tris=[[pts[0],pts[1],pts[2]],[pts[0],pts[2],pts[3]]];
    for(const [A,B,C] of tris){
      const den=(B.sy-C.sy)*(A.sx-C.sx)+(C.sx-B.sx)*(A.sy-C.sy);
      if(Math.abs(den)<1e-6)continue;
      for(let iy=y0;iy<=y1;iy++){
        const py=iy+.5;
        for(let ix=x0;ix<=x1;ix++){
          const px=ix+.5;
          const w1=((B.sy-C.sy)*(px-C.sx)+(C.sx-B.sx)*(py-C.sy))/den;
          const w2=((C.sy-A.sy)*(px-C.sx)+(A.sx-C.sx)*(py-C.sy))/den;
          const w3=1-w1-w2;
          if(w1<-.001||w2<-.001||w3<-.001)continue;
          const d=w1*A.d+w2*B.d+w3*C.d;
          const i=iy*W+ix;
          if(d<=zb[i])continue;
          pix[i]=al===undefined?col:blendPx(pix[i],col,al);
          zb[i]=d;
        }
      }
    }
  };

  // line along 3D segment, depth tested (lines sit on the slab surface)
  const line=(a,b,col)=>{
    const pa=proj(a[0],a[1],a[2]),pb=proj(b[0],b[1],b[2]);
    if(FP&&(pa.zc<.25||pb.zc<.25))return;
    const n=Math.max(2,Math.ceil(Math.hypot(pb.sx-pa.sx,pb.sy-pa.sy)));
    for(let k=0;k<=n;k++){
      const t=k/n,px=pa.sx+(pb.sx-pa.sx)*t,py=pa.sy+(pb.sy-pa.sy)*t,d=pa.d+(pb.d-pa.d)*t;
      const ix=px|0,iy=py|0;
      if(ix<0||ix>=W||iy<0||iy>=H)continue;
      const i=iy*W+ix;
      if(d<zb[i]-.02)continue;
      pix[i]=col;
    }
  };

  const F=[P(-1,-1,1),P(1,-1,1),P(1,1,1),P(-1,1,1)];
  const K=[P(-1,-1,-1),P(1,-1,-1),P(1,1,-1),P(-1,1,-1)];

  if(style==='ember'){
    const FR=[236,242,242],SD=[206,218,218],OE=[255,150,70],GL=[255,190,140];
    quad(K[0],K[1],K[2],K[3],SD,.45);                       // back
    quad(K[0],K[3],F[3],F[0],SD,.4);                        // left side
    quad(K[1],K[2],F[2],F[1],SD,.4);                        // right side
    quad(K[3],K[2],F[2],F[3],SD,.35);                       // top
    quad(K[0],K[1],F[1],F[0],SD,.35);                       // bottom
    quad(F[0],F[1],F[2],F[3],FR,.5);                        // frosted front
    quad(P(-.7,-.8,1.01),P(.7,-.8,1.01),P(.7,.8,1.01),P(-.7,.8,1.01),GL,.22);
    for(let k=0;k<4;k++){
      const k2=(k+1)&3;
      line(F[k],F[k2],OE);
      line(K[k],K[k2],OE);
      line(F[k],K[k],OE);
    }
  }else{
    quad(P(-1,-1,-1),P(1,-1,-1),P(1,1,-1),P(-1,1,-1),pal.s);
    quad(P(-1,-1,-1),P(-1,-1,1),P(-1,1,1),P(-1,1,-1),pal.s);
    quad(P(1,-1,-1),P(1,-1,1),P(1,1,1),P(1,1,-1),pal.s);
    quad(P(-1,1,-1),P(-1,1,1),P(1,1,1),P(1,1,-1),pal.e);
    quad(P(-1,-1,-1),P(-1,-1,1),P(1,-1,1),P(1,-1,-1),pal.s);
    quad(P(-1,-1,1),P(1,-1,1),P(1,1,1),P(-1,1,1),pal.f);
    quad(P(-.7,-.8,1.01),P(.7,-.8,1.01),P(.7,.8,1.01),P(-.7,.8,1.01),pal.g);
  }

  if(style==='void'){
    const WHT=rgb(255,255,255);
    for(let k=0;k<4;k++){
      const k2=(k+1)&3;
      line(F[k],F[k2],WHT);
      line(K[k],K[k2],WHT);
      line(F[k],K[k],WHT);
    }
    // sparse white specks on every face: front, back, left, right, top, bottom
    const faceFns=[
      (p,q)=>P(p,q,1),(p,q)=>P(p,q,-1),
      (p,q)=>P(-1,q,p),(p,q)=>P(1,q,p),
      (p,q)=>P(p,-1,q),(p,q)=>P(p,1,q)
    ];
    for(let fi=0;fi<faceFns.length;fi++){
      for(let gi=0;gi<30;gi++)for(let gj=0;gj<40;gj++){
        const h=hash(gi*7.3+fi*13.1+1.1,gj*3.1+fi*5.7+.7);
        if(h<.985)continue;
        const p=-.92+(gi+hash(gi+fi,gj)*.8)/30*1.84,q=-.92+(gj+hash(gj,gi+fi)*.8)/40*1.84;
        const pt=faceFns[fi](p,q);
        const sp=proj(pt[0],pt[1],pt[2]);
        if(FP&&sp.zc<.25)continue;
        const ix=sp.sx|0,iy=sp.sy|0;
        if(ix<0||ix>=W||iy<0||iy>=H)continue;
        const i=iy*W+ix;
        if(sp.d<zb[i]-.02)continue;
        pix[i]=h>.994?WHT:rgb(170,170,180);
      }
    }
  }
}

function flashStep(dt){if(flashA>0){flashA=Math.max(0,flashA-dt*1.6);flashEl.style.opacity=Math.min(1,flashA);}}
pbtn.onclick=openPicker;

function init(){updPBtn();
  resize();buildScene();tagInterior();updEye();updateDial();drawZoom(true);
  document.getElementById('loading').style.display='none';
  setTimeout(()=>{document.getElementById('hint').style.opacity=0;},9000);
  let last=0;
  const loop=ts=>{const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;if(flow)gt=(gt+dt/75)%24;windT=Math.floor(T*8)/8;update(dt);render();drawZoom();flashStep(dt);requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
}
setTimeout(init,40);
